[project]
name = "doc-etl-api"
version = "0.1.0"
description = "Documents ETL API using Docling and LlamaIndex"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Doc ETL API Contributors" },
]
keywords = ["etl", "documents", "rag", "llamaindex", "docling", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Carries the OCR engine the PDF pipeline is configured with: `easyocr`
    # arrives only through this extra. See "Scanned documents and OCR" in the README.
    "docling[easyocr]>=2.5.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=2.0.0",
    "llama-index>=0.12.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    # The durable vector store backend, selected by VECTOR_STORE_BACKEND=postgres.
    # Two packages, because a durable index is two stores: pgvector holds the
    # embeddings, and the docstore package keeps each chunk's text and metadata in
    # the same database, so a hit and the text it points at cannot disagree after a
    # restart. pgvector's table holds the text too, so a chunk is stored twice on
    # purpose -- one row for search, one for every read of content. See "Vector
    # store backends" in the README.
    "llama-index-vector-stores-postgres>=0.9.0",
    "llama-index-storage-docstore-postgres>=0.6.0",
    "python-multipart>=0.0.17",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.scripts]
doc-etl-api = "doc_etl_api.main:run"

[tool.setuptools.packages.find]
include = ["doc_etl_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff]
line-length = 100
